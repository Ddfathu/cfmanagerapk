name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository kode
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Gradle Environment & Cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x ./gradlew || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar fallback..."
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

      # 5. Compile APK Release
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 6. Auto Sign APK Pake Keystore Permanen
      - name: Sign APK Automatically
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: my-alias
          keyStorePassword: '123456'
          keyPassword: '123456'
          buildToolsVersion: '34.0.0' # Fix lokasi zipalign biar gak nyari versi 29.0.3 lagi

      # 7. Upload Hasil APK Release Ter-sign
      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: CF-Manager-Release-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 14
