name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository kode
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Gradle Environment & Cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x ./gradlew || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar fallback..."
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

      # 5. Compile APK Release Unsigned
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 6. Sign & Zipalign Pake SDK Bawaan Runner (Otomatis deteksi versi build-tools aktif)
      - name: Sign & Zipalign APK
        run: |
          # 1. Decode keystore dari Secret GitHub ke file release.jks
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          
          # 2. Cari folder build-tools terbaru di runner
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          echo "Menggunakan Build Tools dari: $BUILD_TOOLS_DIR"
          
          # 3. Cari lokasi APK hasil build
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # 4. Align APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" app-release-aligned.apk
          
          # 5. Sign APK pake apksigner bawaan Android SDK
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --out cfmanager-signed.apk app-release-aligned.apk
          
          # 6. Hapus file temporary
          rm -f release.jks app-release-aligned.apk

      # 7. Upload Hasil APK Release Ter-sign
      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: CF-Manager-Release-APK
          path: cfmanager-signed.apk
          if-no-files-found: error
          retention-days: 14
